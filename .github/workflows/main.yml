name: Render Remotion Video

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm install

      - run: npx remotion compositions src/Index.ts

      - run: npx remotion render src/Index.ts Main out/video.mp4

      - uses: actions/upload-artifact@v4
        with:
          name: rendered-video
          path: out/video.mp4
          
