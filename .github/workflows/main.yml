- name: Install dependencies
  run: npm ci

- name: List compositions
  run: npx remotion compositions src/index.ts

- name: Render video
  run: npx remotion render src/index.ts Main out/video.mp4

- name: Upload video
  uses: actions/upload-artifact@v4
  with:
    name: rendered-video
    path: out/video.mp4
